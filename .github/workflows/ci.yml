name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verificar:
    name: Lint, tipos, tests, build y e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Auditoría de dependencias
        # GHSA-vfj7-8cjw-p6xm: braces (solo dev, vía eslint-config-next). Ver docs/DECISIONES.md (ADR-007).
        run: bun audit --audit-level=moderate --ignore=GHSA-vfj7-8cjw-p6xm

      - name: Lint
        run: bun run lint

      - name: Tipos
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Instalar Chromium para Playwright
        run: bunx playwright install --with-deps chromium

      - name: E2E (modo demo)
        run: bun run e2e
        env:
          CI: "true"

      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
